{% extends 'base.html' %}{% block content %}<h1>Contacts</h1><div class="grid"><section class="panel"><h2>Add contact</h2><form method="post"><input name="name" placeholder="Name" required><input name="email" placeholder="Email"><input name="phone" placeholder="Phone"><input name="company" placeholder="Company"><button>Add contact</button></form></section><section class="panel"><form method="get" class="search"><input name="q" value="{{q}}" placeholder="Search contacts"><button>Search</button></form>{% for c in contacts %}<div class="row"><div><b>{{c.name}}</b><br><small>{{c.email}} · {{c.phone}} · {{c.company}}</small></div><details><summary>Edit</summary><form method="post" action="/contacts/{{c.id}}/edit"><input name="name" value="{{c.name}}"><input name="email" value="{{c.email}}"><input name="phone" value="{{c.phone}}"><input name="company" value="{{c.company}}"><button>Save</button></form></details><form method="post" action="/contacts/{{c.id}}/delete"><button class="danger">Delete</button></form></div>{% else %}<p class="muted">No contacts found.</p>{% endfor %}</section></div>{% endblock %}
