{% extends 'base.html' %}{% block content %}<h1>AI Assistant</h1><section class="panel"><p class="muted">Local Ollama assistant (Gemma 4 2B where available).</p><textarea id="prompt" placeholder="Ask about leads, contacts, call workflows..."></textarea><button onclick="ask()">Ask assistant</button><pre id="reply">Ready.</pre></section><script>async function ask(){let p=document.getElementById('prompt').value;let r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});document.getElementById('reply').textContent=(await r.json()).reply}</script>{% endblock %}
