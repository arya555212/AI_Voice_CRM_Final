{% extends 'base.html' %}{% block content %}<h1>Leads</h1><div class="grid"><section class="panel"><h2>Add lead</h2><form method="post"><input name="name" placeholder="Name" required><input name="company" placeholder="Company"><input name="email" placeholder="Email"><select name="status"><option>New</option><option>Contacted</option><option>Qualified</option><option>Won</option><option>Lost</option></select><textarea name="notes" placeholder="Notes"></textarea><button>Add lead</button></form></section><section class="panel">{% for l in leads %}<div class="row"><div><b>{{l.name}}</b> <span class="badge">{{l.status}}</span><br><small>{{l.company}} · {{l.email}}</small><br><small>{{l.notes}}</small></div><form method="post" action="/leads/{{l.id}}/status"><select name="status"><option>New</option><option>Contacted</option><option>Qualified</option><option>Won</option><option>Lost</option></select><button>Update</button></form><form method="post" action="/leads/{{l.id}}/delete"><button class="danger">Delete</button></form></div>{% else %}<p class="muted">No leads yet.</p>{% endfor %}</section></div>{% endblock %}
